spring.application.name=student-skill-internship
server.port=8080

# Update these values for your local MySQL installation.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_internship_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
